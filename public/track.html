<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Track Order — Vrinda Wellness</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/tw-config.js"></script>
  <link rel="stylesheet" href="/theme.css"/>
  <style>
    .pill{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 10px;border-radius:100px;text-transform:capitalize}
    .tl-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid rgba(0,0,0,.15);background:#fff;color:rgba(0,0,0,.35);flex-shrink:0}
    .tl-dot.done{background:var(--accent);border-color:var(--accent);color:#fff}
    .tl-line{flex:1;height:2px;background:rgba(0,0,0,.08);margin:0 8px}
    .tl-line.done{background:var(--accent)}
  </style>
</head>
<body data-page="track" data-zone="medicines">

<div id="site-header"></div>

<main class="max-w-2xl mx-auto px-4 md:px-6 py-10 md:py-14">
  <div class="crumbs mb-6"><a href="/home.html">Home</a><i class="fas fa-chevron-right"></i><span class="current">Track Order</span></div>

  <span class="eyebrow">Where's my order?</span>
  <h1 class="sec-title text-2xl md:text-3xl tracking-tight mb-2">Track Your Order</h1>
  <p class="text-sm muted mb-8">Enter the order number from your confirmation — it looks like <span class="font-mono font-semibold" style="color:var(--accent)">VRN-123456</span></p>

  <!-- search card -->
  <div class="card p-6 md:p-8 mb-6">
    <form id="track-form" class="flex flex-col sm:flex-row gap-3">
      <div class="relative flex-1">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-sm" style="color:rgba(0,0,0,.3)"><i class="fas fa-box"></i></span>
        <input id="track-input" class="input" style="padding-left:44px;text-transform:uppercase;font-family:ui-monospace,monospace;letter-spacing:.05em"
               placeholder="VRN-123456" maxlength="12" autocomplete="off" required/>
      </div>
      <button type="submit" class="btn btn-primary"><i class="fas fa-magnifying-glass text-xs"></i> Track</button>
    </form>
    <p class="text-[11px] mt-3" style="color:rgba(0,0,0,.4)"><i class="fas fa-circle-info mr-1"></i>Can't find your number? It's on your order confirmation — or call us at +91 99673 78987.</p>
  </div>

  <div id="result"></div>
</main>

<div id="site-footer"></div>

<script src="/layout.js"></script>
<script>
(function () {
  'use strict';

  const input = document.getElementById('track-input');
  const result = document.getElementById('result');

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const inr = n => '₹' + Number(n).toLocaleString('en-IN');
  const dateFmt = d => new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });

  const STATUS = {
    placed: ['#B45309','#FEF3C7'], confirmed: ['#1D4ED8','#DBEAFE'], packed: ['#7C3AED','#EDE9FE'],
    shipped: ['#0E7490','#CFFAFE'], delivered: ['#166534','#DCFCE7'], cancelled: ['#B91C1C','#FEE2E2'],
  };
  const pill = s => { const [fg,bg] = STATUS[s] || ['#333','#eee']; return `<span class="pill" style="color:${fg};background:${bg}">${s}</span>`; };
  const STEPS = ['placed', 'confirmed', 'packed', 'shipped', 'delivered'];
  const LABELS = ['Placed', 'Confirmed', 'Packed', 'Out for delivery', 'Delivered'];

  const eta = new Date(Date.now() + 86400000)
    .toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });

  function showLoading() {
    result.innerHTML = `
      <div class="card p-8 text-center">
        <i class="fas fa-circle-notch fa-spin text-xl mb-3" style="color:var(--accent)"></i>
        <p class="text-sm muted">Looking up your order...</p>
      </div>`;
  }

  function showNotFound(msg) {
    result.innerHTML = `
      <div class="card p-8 text-center">
        <div class="w-14 h-14 rounded-2xl mx-auto mb-4 flex items-center justify-center" style="background:rgba(225,29,72,.08)">
          <i class="fas fa-box-open text-xl" style="color:#E11D48"></i>
        </div>
        <p class="text-sm font-semibold mb-1" style="color:var(--ink)">${esc(msg)}</p>
        <p class="text-xs muted mb-5">Double-check the number on your confirmation page, or call us and we'll find it together.</p>
        <a href="contact.html" class="btn btn-outline btn-sm">Contact Support</a>
      </div>`;
  }

  function showOrder(o) {
    const idx = STEPS.indexOf(o.status);

    const timeline = o.status === 'cancelled' ? `
      <div class="flex items-start gap-2.5 p-4 rounded-xl mb-2" style="background:rgba(225,29,72,.06);border:1px solid rgba(225,29,72,.15)">
        <i class="fas fa-circle-xmark mt-0.5" style="color:#B91C1C"></i>
        <p class="text-xs leading-relaxed" style="color:rgba(0,0,0,.6)">This order was cancelled. If this is unexpected, call us at <strong style="color:#153628">+91 99673 78987</strong>.</p>
      </div>` : `
      <div class="flex items-center text-left mb-1">
        ${STEPS.map((s, i) => `
          <span class="tl-dot ${i <= idx ? 'done' : ''}">${i < idx ? '<i class="fas fa-check"></i>' : (i === idx ? '<i class="fas fa-circle" style="font-size:6px"></i>' : '')}</span>
          ${i < STEPS.length - 1 ? `<span class="tl-line ${i < idx ? 'done' : ''}"></span>` : ''}
        `).join('')}
      </div>
      <div class="flex justify-between text-[9px] md:text-[10px] font-semibold mb-4 px-1" style="color:rgba(0,0,0,.45)">
        ${LABELS.map((l, i) => `<span style="color:${i <= idx ? 'var(--accent)' : 'rgba(0,0,0,.35)'}">${l}</span>`).join('')}
      </div>`;

    result.innerHTML = `
    <div class="card p-6 md:p-8">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div class="flex items-center gap-3 flex-wrap">
          <span class="font-mono font-bold text-sm" style="color:var(--ink)">${esc(o.orderNumber)}</span>
          ${pill(o.status)}
        </div>
        <span class="text-xs" style="color:rgba(0,0,0,.4)">Placed ${dateFmt(o.placedAt)}</span>
      </div>

      <p class="text-sm mb-6" style="color:rgba(0,0,0,.6)">Hi <strong style="color:var(--ink)">${esc(o.firstName)}</strong>! ${o.status === 'delivered' ? 'Your order has been delivered. ' : o.status === 'cancelled' ? '' : 'Your order is on its way'} ${o.status !== 'delivered' && o.status !== 'cancelled' ? `to <strong style="color:var(--ink)">${esc(o.city)} ${esc(o.pincode)}</strong>.` : ''}</p>

      ${timeline}

      ${o.status !== 'cancelled' ? `
      <div class="flex items-center gap-2.5 text-xs p-3 rounded-xl mb-5" style="background:var(--accent-soft);color:var(--ink)">
        <i class="fas ${o.status === 'delivered' ? 'fa-circle-check' : 'fa-truck'}" style="color:var(--accent)"></i>
        ${o.status === 'delivered'
          ? '<strong>Delivered</strong> — we hope everything was perfect!'
          : `Estimated delivery: <strong>${eta}</strong>`}
      </div>` : ''}

      <div class="grid grid-cols-3 gap-3 pt-4" style="border-top:1px solid rgba(0,0,0,.06)">
        <div><p class="text-[10px] font-bold uppercase tracking-wider mb-1" style="color:rgba(0,0,0,.35)">Items</p><p class="text-sm font-semibold" style="color:var(--ink)">${o.itemCount}</p></div>
        <div><p class="text-[10px] font-bold uppercase tracking-wider mb-1" style="color:rgba(0,0,0,.35)">Payment</p><p class="text-sm font-semibold uppercase" style="color:var(--ink)">${esc(o.paymentMethod)}</p></div>
        <div><p class="text-[10px] font-bold uppercase tracking-wider mb-1" style="color:rgba(0,0,0,.35)">Total</p><p class="text-sm font-bold" style="color:var(--forest)">${inr(o.total)}</p></div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 justify-center mt-6">
        <a href="/products.html" class="btn btn-primary btn-sm">Continue Shopping</a>
        <a href="contact.html" class="btn btn-outline btn-sm">Need Help?</a>
      </div>
    </div>`;

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function track(number) {
    showLoading();
    try {
      const res = await fetch('/api/v1/orders/track/' + encodeURIComponent(number));
      const data = await res.json();
      if (!data.success) { showNotFound(data.message || 'Order not found'); return; }
      showOrder(data.order);
    } catch {
      showNotFound('Could not reach the server — is it running?');
    }
  }

  document.getElementById('track-form').addEventListener('submit', e => {
    e.preventDefault();
    const v = input.value.trim().toUpperCase().replace(/\s+/g, '');
    if (!v) return;
    input.value = v;
    // update the URL so the result is shareable/refreshable
    history.replaceState(null, '', '/track.html?number=' + encodeURIComponent(v));
    track(v);
  });

  // auto-load from ?number=
  const pre = new URLSearchParams(location.search).get('number');
  if (pre) { input.value = pre.trim().toUpperCase(); track(pre.trim().toUpperCase()); }
})();
</script>
</body>
</html>
